<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sega Mega Drive Catalog</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #00e676;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            background-color: #202024;
            border: 2px solid #29292e;
            border-radius: 8px;
            color: #ffffff;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #00e676;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .game-card {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #00e676;
        }

        .game-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #18181b;
        }

        .game-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .game-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f4f4f5;
            line-height: 1.3;
        }

        .play-btn {
            display: block;
            text-align: center;
            background-color: #00e676;
            color: #000000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: #00c853;
        }

        .no-results {
            text-align: center;
            color: #8d8d99;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>

    function renderGames(list) {
        const grid = document.getElementById('gameGrid');
        grid.innerHTML = '';

        if (list.length === 0) {
            grid.innerHTML = '<div class="no-results">Игры не найдены</div>';
            return;
        }

        const fragment = document.createDocumentFragment();

        list.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            const playUrl = `player.html?game=${encodeURIComponent(game.file)}`;

            const img = document.createElement('img');
            img.className = 'game-cover';
            img.alt = game.name;
            img.src = game.img;
            img.onerror = function() {
                this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="180" viewBox="0 0 220 180"><rect width="220" height="180" fill="%2318181b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%238d8d99" font-family="sans-serif" font-size="14">No Cover</text></svg>';
            };

            const details = document.createElement('div');
            details.className = 'game-details';

            const title = document.createElement('span');
            title.className = 'game-title';
            title.textContent = game.name;

            const btn = document.createElement('a');
            btn.className = 'play-btn';
            btn.href = playUrl;
            btn.textContent = 'Играть';

            details.appendChild(title);
            details.appendChild(btn);
            card.appendChild(img);
            card.appendChild(details);

            fragment.appendChild(card);
        });

        grid.appendChild(fragment);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase().trim();
        const filtered = games.filter(game => 
            game.name.toLowerCase().includes(searchTerm) || 
            game.file.toLowerCase().includes(searchTerm)
        );
        renderGames(filtered);
    });

    renderGames(games);
</script>
