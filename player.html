<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Player</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      background: #121212; 
      overflow: hidden; 
      font-family: sans-serif;
    }
    
    #game { 
      width: 100vw; 
      height: 100vh; 
    }

    /* Кнопка "Назад" */
    .back-button {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 99999;
      background: #2ecc71;
      color: #000;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-button:hover {
      background: #27ae60;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Кнопка перехода в каталог -->
  <a href="index.html" class="back-button">←</a>

  <div id="game"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameFile = urlParams.get('game');
    const systemCore = urlParams.get('core') || 'segaMD'; 

    EJS_player = '#game';
    EJS_core = systemCore; 
    EJS_gameUrl = gameFile; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
